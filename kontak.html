<!doctype html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kontak | InfoLomba</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <!-- Navbar -->
    <header class="navbar">
        <h1 class="logo">InfoLomba</h1>
        <nav>
            <ul class="menu">
                <li><a href="index.html">Beranda</a></li>
                <li><a href="profil.html">Profil</a></li>
                <li><a href="kegiatan.html">Daftar Lomba</a></li>

            </ul>
        </nav>
        <button id="tombol-tema" type="button">Mode Gelap</button>
    </header>
    <!-- Konten utama -->
    <main>
        <h2>Kontak</h2>
        <section class="info-kontak">
            <p><strong>Alamat:</strong> Politeknik Negeri Cilacap, Jl. Dr. Soetomo No.1, Sidakaya, Cilacap</p>
            <p><strong>Email:</strong> infolombamahasiswa@gmail.com</p>
            <p><strong>Instagram:</strong> @infolomba.mhs</p>
        </section>

        <section class="form-kontak">
            <h2>Kirim Info Lomba atau Pertanyaan</h2>
            <label for="nama">Nama</label>
            <input type="text" id="nama" placeholder="Nama Anda"/>
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="email@contoh.com"/>
            <label for="pesan">Pesan</label>
            <textarea id="pesan" rows="4"></textarea>
            <button type="button" id="tombol-kirim">Kirim</button>
            <p id="status-form"></p>
        </section>
    </main>
    <!-- Footer -->
    <footer>
        <p>&copy; 2026 InfoLomba - Informasi Lomba Mahasiswa</p>
    </footer>
    <script src="js/script.js"></script>
